<!DOCTYPE html>
<html lang="es" class="notranslate" translate="no">
<head>
    <meta name="google" content="notranslate">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEGUR.Ec PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; margin: 0; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); border-radius: 24px; }
        
        /* SPLASH SCREEN */
        #splash-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #0f172a; display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 99999;
            transition: opacity 1s ease;
        }
        .loader {
            border: 4px solid #1e293b; border-top: 4px solid #3b82f6;
            border-radius: 50%; width: 45px; height: 45px;
            animation: spin 1s linear infinite; margin-top: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .fade-out { opacity: 0; pointer-events: none; }
    </style>
</head>
<body class="flex items-center justify-center h-screen overflow-hidden">

    <div id="splash-screen">
        <img src="1775117363779.png" style="width: 180px; height: auto; border-radius: 15px; box-shadow: 0 0 30px rgba(59, 130, 246, 0.3);">
        <div class="loader"></div>
        <h2 style="margin-top: 25px; letter-spacing: 3px; font-weight: bold;">SEGUR.Ec PRO</h2>
    </div>

    <div id="auth-screen" class="w-full max-w-md p-6">
        <div class="glass p-8 text-center">
            <i class="fas fa-shield-halved text-5xl text-blue-500 mb-4"></i>
            <h1 class="text-2xl font-bold mb-2">SEGUR.Ec PRO</h1>
            <p class="text-gray-400 text-sm mb-8">Acceso de Seguridad Nacional</p>
            <input type="number" placeholder="Cédula" class="w-full bg-[#1e293b] border border-[#334155] p-3 rounded-xl mb-3 text-white outline-none">
            <input type="password" placeholder="Contraseña" class="w-full bg-[#1e293b] border border-[#334155] p-3 rounded-xl mb-6 text-white outline-none">
            <button class="w-full bg-blue-600 p-4 rounded-xl font-bold shadow-lg active:scale-95 transition-all">INGRESAR AL SISTEMA</button>
        </div>
    </div>

    <script>
        // Control del Splash
        window.addEventListener('load', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                if(splash) splash.classList.add('fade-out');
            }, 3500);
        });
    </script>
</body>
</html>
