<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEGUR.Ec PRO | Terminal de Inteligencia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #0f172a; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); border-radius: 24px; }
        .input-dark { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 12px; width: 100%; color: white; outline: none; }
        .input-dark:focus { border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.3); }
        .chat-area { height: calc(100vh - 180px); overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 20px; }
        .msg { max-width: 80%; padding: 12px; border-radius: 15px; font-size: 14px; position: relative; }
        .msg-policia { background: #1d4ed8; align-self: flex-start; border-bottom-left-radius: 2px; }
        .msg-ciudadano { background: #059669; align-self: flex-end; border-bottom-right-radius: 2px; }
        .alias-tag { font-size: 10px; font-weight: bold; color: #94a3b8; margin-bottom: 4px; display: block; }
    </style>
</head>
<body class="flex items-center justify-center h-screen overflow-hidden">

    <div id="auth-screen" class="w-full max-w-md p-6">
        <div class="glass-panel p-8 text-center">
            <i class="fas fa-shield-halved text-5xl text-blue-500 mb-4"></i>
            <h1 class="text-2xl font-bold mb-2">SEGUR.Ec PRO</h1>
            <p class="text-gray-400 text-sm mb-8">Acceso de Seguridad Nacional</p>

            <div id="register-only">
                <input id="reg-name" type="text" placeholder="Nombre y Apellido Real" class="input-dark mb-3">
                <select id="reg-role" class="input-dark mb-3">
                    <option value="CIUDADANO">Perfil: Ciudadano</option>
                    <option value="POLICIA">Perfil: Policía</option>
                </select>
            </div>

            <input id="auth-ci" type="number" placeholder="Número de Cédula" class="input-dark mb-3">
            <input id="auth-pass" type="password" placeholder="Contraseña (Mín. 6)" class="input-dark mb-6">

            <button onclick="ejecutarAcceso()" id="main-btn" class="w-full bg-blue-600 hover:bg-blue-700 p-4 rounded-xl font-bold transition-all shadow-lg">INGRESAR AL SISTEMA</button>
            
            <p onclick="toggleAuth()" id="toggle-link" class="mt-6 text-xs text-blue-400 cursor-pointer hover:underline">¿Ya tienes cuenta? Inicia Sesión</p>
        </div>
    </div>

    <div id="app-screen" class="hidden w-full h-full flex flex-col bg-[#0b141a]">
        <header class="p-4 bg-[#202c33] flex justify-between items-center border-b border-gray-700">
            <div class="flex items-center gap-3">
                <div class="w-3 h-3 bg-green-500 rounded-full animate-pulse"></div>
                <div>
                    <p id="user-display" class="font-bold text-sm text-blue-400"></p>
                    <p class="text-[10px] text-gray-500">CANAL DE INTELIGENCIA ACTIVO</p>
                </div>
            </div>
            <button onclick="location.reload()" class="text-gray-400 hover:text-white"><i class="fas fa-sign-out-alt"></i></button>
        </header>

        <div id="chat-container" class="chat-area"></div>

        <footer class="p-4 bg-[#202c33] flex gap-2">
            <button onclick="panico()" class="w-12 h-12 bg-red-600 rounded-full flex items-center justify-center active:scale-90"><i class="fas fa-radiation"></i></button>
            <input id="msg-input" type="text" placeholder="Escriba novedad..." class="flex-1 bg-[#2a3942] border-none rounded-full px-4 text-sm outline-none">
            <button onclick="enviar()" class="w-12 h-12 bg-blue-600 rounded-full flex items-center justify-center"><i class="fas fa-paper-plane"></i></button>
        </footer>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCKANjXbis2TtEnbc_wWL8JF073DLcnhN4",
            authDomain: "segurec-3381a.firebaseapp.com",
            projectId: "segurec-3381a",
            storageBucket: "segurec-3381a.firebasestorage.app",
            messagingSenderId: "273054952247",
            appId: "1:273054952247:web:0b6fb5014d16dbfc1e08b2"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let esLogin = false;
        let perfilActual = null;

        window.toggleAuth = () => {
            esLogin = !esLogin;
            document.getElementById('register-only').classList.toggle('hidden');
            document.getElementById('main-btn').innerText = esLogin ? "INICIAR SESIÓN" : "CREAR CUENTA OPERATIVA";
            document.getElementById('toggle-link').innerText = esLogin ? "¿No tienes cuenta? Regístrate" : "¿Ya tienes cuenta? Inicia Sesión";
        };

        window.ejecutarAcceso = async () => {
            const ci = document.getElementById('auth-ci').value;
            const pass = document.getElementById('auth-pass').value;
            const pseudoEmail = `sec_${ci}@segurec.net`;

            try {
                if (esLogin) {
                    const userCredential = await signInWithEmailAndPassword(auth, pseudoEmail, pass);
                    const docSnap = await getDoc(doc(db, "usuarios_final", userCredential.user.uid));
                    perfilActual = docSnap.data();
                } else {
                    const nombre = document.getElementById('reg-name').value;
                    const rol = document.getElementById('reg-role').value;
                    if(!nombre || !ci) return alert("Complete los datos reales.");

                    const userCredential = await createUserWithEmailAndPassword(auth, pseudoEmail, pass);
                    // GENERADOR DE ALIAS AUTOMÁTICO
                    const alias = `${rol}-${ci.slice(-4)}`;
                    perfilActual = { uid: userCredential.user.uid, nombre: nombre, rol: rol, alias: alias, ci: ci };
                    await setDoc(doc(db, "usuarios_final", userCredential.user.uid), perfilActual);
                }
                mostrarApp();
            } catch (error) { alert("Error de acceso: " + error.message); }
        };

        function mostrarApp() {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('app-screen').classList.remove('hidden');
            document.getElementById('user-display').innerText = perfilActual.alias;

            const q = query(collection(db, "chat_seguro"), orderBy("fecha", "asc"));
            onSnapshot(q, (snapshot) => {
                const chatContainer = document.getElementById('chat-container');
                chatContainer.innerHTML = "";
                snapshot.forEach((d) => {
                    const m = d.data();
                    const esMio = m.uid === perfilActual.uid;
                    const div = document.createElement('div');
                    div.className = `msg ${m.rol === 'POLICIA' ? 'msg-policia' : 'msg-ciudadano'}`;
                    div.style.alignSelf = esMio ? 'flex-end' : 'flex-start';
                    // SEGURIDAD: Solo se muestra el ALIAS, nunca el nombre real
                    div.innerHTML = `<span class="alias-tag">${m.alias}</span><p>${m.texto}</p>`;
                    chatContainer.appendChild(div);
                });
                chatContainer.scrollTop = chatContainer.scrollHeight;
            });
        }

        window.enviar = async () => {
            const input = document.getElementById('msg-input');
            if(!input.value) return;
            await addDoc(collection(db, "chat_seguro"), {
                uid: perfilActual.uid,
                alias: perfilActual.alias,
                rol: perfilActual.rol,
                texto: input.value,
                fecha: serverTimestamp()
            });
            input.value = "";
        };

        window.panico = async () => {
            await addDoc(collection(db, "chat_seguro"), {
                uid: perfilActual.uid,
                alias: perfilActual.alias,
                rol: perfilActual.rol,
                texto: "🚨 ALERTA DE PÁNICO ACTIVADA - REQUIERO ASISTENCIA 🚨",
                fecha: serverTimestamp()
            });
        };
    </script>
</body>
</html>
